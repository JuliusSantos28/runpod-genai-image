name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space (the CUDA base image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          tag=ghcr.io/juliussantos28/runpod-genai
          docker build -t $tag:latest -t $tag:${GITHUB_SHA::7} .
          docker push $tag:latest
          docker push $tag:${GITHUB_SHA::7}
          docker inspect --format '{{index .RepoDigests 0}}' $tag:latest | tee digest.txt
          echo "### Image" >> $GITHUB_STEP_SUMMARY; cat digest.txt >> $GITHUB_STEP_SUMMARY
